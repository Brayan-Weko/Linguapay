name: "Docker Smoke Test & Healthcheck (Non Bloquant)"

on:
  push:
    branches: ["main", "master", "develop", "staging"]
    paths:
      - "backend/**"
      - "simulator/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-smoke-test.yml"
  workflow_dispatch:

jobs:
  docker-smoke:
    name: "Docker Compose Up & Probe /health"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: "Démarrer l'infrastructure LinguaPay via Docker Compose"
        run: |
          docker compose up -d

      - name: "Attendre le démarrage et sonder le endpoint /health et simulateur"
        run: |
          sleep 10
          for i in {1..15}; do
            if curl -s http://localhost:8000/api/v1/health | grep -q '"status":"ok"'; then
              echo "Backend health check passed!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          curl --fail http://localhost:5173/index.html || exit 1

      - name: "Nettoyer les conteneurs"
        if: always()
        run: docker compose down || true
