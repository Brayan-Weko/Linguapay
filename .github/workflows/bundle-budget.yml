name: Extension Bundle Size & Budget Check

on:
  push:
    branches: [main, master, develop, dev, staging]
    paths:
      - 'extension/**'
      - '.github/workflows/bundle-budget.yml'
  pull_request:
    branches: [main, master, develop, dev, staging]
    paths:
      - 'extension/**'
      - '.github/workflows/bundle-budget.yml'

jobs:
  bundle-budget:
    name: Check Extension Bundle Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install
        working-directory: extension

      - name: Build extension
        run: npm run build
        working-directory: extension

      - name: Verify bundle size limits
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const distDir = path.join('extension', 'dist');
            if (!fs.existsSync(distDir)) {
              console.error('Dist directory does not exist:', distDir);
              process.exit(1);
            }
            const files = fs.readdirSync(distDir);
            let totalJsSize = 0;
            const MAX_SINGLE_FILE_BYTES = 500 * 1024; // 500 KB limit per bundle file
            let failed = false;

            for (const file of files) {
              const fullPath = path.join(distDir, file);
              const stats = fs.statSync(fullPath);
              if (stats.isFile()) {
                const sizeKb = (stats.size / 1024).toFixed(2);
                console.log(\`Bundle file: \${file} - \${sizeKb} KB\`);
                if (stats.size > MAX_SINGLE_FILE_BYTES) {
                  console.error(\`File \${file} exceeds budget limit of 500 KB!\`);
                  failed = true;
                }
              }
            }
            if (failed) process.exit(1);
            console.log('Bundle budget check passed successfully.');
          "
