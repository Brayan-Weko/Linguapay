name: "Audit de Sécurité & Dépendances (Bloquant)"

on:
  push:
    branches: ["main", "dev", "staging"]
  pull_request:
    branches: ["main", "dev", "staging"]
  schedule:
    # Analyse hebdomadaire de sécurité chaque lundi à 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  audit-backend:
    name: "Audit Sécurité Python Backend (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "Installer Bandit"
        run: pip install bandit
      - name: "Analyse statique de sécurité Bandit"
        run: bandit -r backend/app -ll -s B104

  audit-extension:
    name: "Audit Dépendances Extension (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Vérifier les vulnérabilités npm"
        working-directory: extension
        run: npm audit --audit-level=high || true

  secret-scan:
    name: "Détection de secrets et clés privées (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Scan anti-fuite de secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
