name: "Audit de Sécurité & Dépendances (Bloquant)"

on:
  push:
    branches: ["main", "master", "develop", "dev", "staging"]
  pull_request:
    branches: ["main", "master", "develop", "dev", "staging"]
  schedule:
    # Analyse hebdomadaire de sécurité chaque lundi à 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  audit-backend:
    name: "Audit Dépendances Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Vérifier les vulnérabilités npm (backend)"
        working-directory: backend
        # Échoue en cas de vulnérabilité critique ou élevée
        run: npm audit --audit-level=high

  audit-frontend:
    name: "Audit Dépendances Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Vérifier les vulnérabilités npm (frontend)"
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scan:
    name: "Détection de secrets et clés privées (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Scan anti-fuite de secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

