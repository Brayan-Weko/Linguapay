name: "CI Extension Client (Bloquant)"

on:
  push:
    branches: ["main", "dev", "staging"]
    paths:
      - "extension/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: ["main", "dev", "staging"]
    paths:
      - "extension/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: "Vérification Extension (TypeScript, Build MV3 & Tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Récupérer le code source"
        uses: actions/checkout@v4

      - name: "Configurer Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "Installer les dépendances extension"
        working-directory: extension
        run: npm install

      - name: "Vérification du typage TypeScript"
        working-directory: extension
        run: npm run typecheck

      - name: "Exécuter les tests unitaires (Vitest)"
        working-directory: extension
        run: npm test

      - name: "Compiler l'extension MV3 pour production"
        working-directory: extension
        run: npm run build
