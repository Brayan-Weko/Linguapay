name: "Validation Variables d'Environnement (Bloquant)"

on:
  push:
    paths:
      - "backend/.env.example"
      - "backend/src/config/env.ts"
      - ".github/workflows/env-validation.yml"
  pull_request:
    paths:
      - "backend/.env.example"
      - "backend/src/config/env.ts"
      - ".github/workflows/env-validation.yml"

jobs:
  validate-env:
    name: "Conformité .env.example / Schéma Zod"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: "Installer les dépendances backend"
        working-directory: backend
        run: npm ci
      - name: "Tester le chargement d'un environnement depuis .env.example"
        working-directory: backend
        run: |
          node -e '
            import dotenv from "dotenv";
            import fs from "fs";
            const parsed = dotenv.parse(fs.readFileSync(".env.example"));
            const requiredKeys = ["JWT_SECRET", "ADMIN_JWT_SECRET", "ENCRYPTION_KEY", "PORT", "DATABASE_URL"];
            const missing = requiredKeys.filter(k => !(k in parsed));
            if (missing.length > 0) {
              console.error("Clés obligatoires manquantes dans .env.example:", missing);
              process.exit(1);
            }
            console.log("Validation .env.example réussie : toutes les clés fondamentales sont déclarées.");
          '

