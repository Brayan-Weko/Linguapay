name: "Validation Variables d'Environnement (Bloquant)"

on:
  push:
    paths:
      - "backend/.env.example"
      - "backend/app/config.py"
      - ".github/workflows/env-validation.yml"
  pull_request:
    paths:
      - "backend/.env.example"
      - "backend/app/config.py"
      - ".github/workflows/env-validation.yml"

jobs:
  validate-env:
    name: "Conformité .env.example / Pydantic Settings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Configurer Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "Installer dépendances backend"
        run: |
          pip install pydantic-settings python-dotenv

      - name: "Tester le chargement des variables d'environnement LinguaPay"
        working-directory: backend
        run: |
          python -c "
          from dotenv import dotenv_values
          vals = dotenv_values('.env.example')
          required = ['LINGUAPAY_AI_PROVIDER', 'LINGUAPAY_PORT', 'LINGUAPAY_STRICT_VERIFIER', 'LINGUAPAY_LOG_PII']
          missing = [k for k in required if k not in vals]
          if missing:
              raise ValueError(f'Missing required keys in .env.example: {missing}')
          print('.env.example is compliant with LinguaPay Pydantic Settings.')
          "
