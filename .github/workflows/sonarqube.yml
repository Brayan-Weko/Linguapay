name: "Analyse Qualité SonarQube (Optionnel)"

on:
  push:
    branches: ["main", "master", "develop", "dev", "staging"]
  pull_request:
    branches: ["main", "master", "develop", "dev", "staging"]
  workflow_dispatch:

jobs:
  sonarqube:
    name: "SonarQube Code Analysis"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Vérifier la présence du secret SonarQube"
        id: check-secret
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN non configuré. Analyse ignorée gracieusement."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: "Analyse SonarQube / SonarCloud"
        if: steps.check-secret.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=linguapay-safinum
            -Dsonar.sources=backend/app,extension/src
            -Dsonar.tests=backend/tests
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
