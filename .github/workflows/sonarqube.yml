name: "Analyse Qualité SonarQube (Non Bloquant)"

on:
  push:
    branches: ["main", "master", "develop", "dev", "staging"]
  pull_request:
    branches: ["main", "master", "develop", "dev", "staging"]
  workflow_dispatch:

jobs:
  sonarqube:
    name: "SonarQube Code Analysis"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configurer Node.js 20.x"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "Générer la couverture de code backend"
        working-directory: backend
        run: |
          npm ci
          npm run db:generate
          npm test -- --coverage || true

      - name: "Analyse SonarQube / SonarCloud"
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=jobbot-saas
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.tests=backend/test
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.db

