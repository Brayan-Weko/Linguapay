name: "Qualité & Formatage du Code (Bloquant)"

on:
  push:
    branches: ["main", "master", "develop", "dev", "staging"]
  pull_request:
    branches: ["main", "master", "develop", "dev", "staging"]

jobs:
  format-and-lint:
    name: "Vérification Formatage & Bonnes Pratiques"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Configurer Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "Configurer Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "Installer dépendances extension"
        working-directory: extension
        run: npm install

      - name: "Vérifier le typage TypeScript extension"
        working-directory: extension
        run: npm run typecheck

      - name: "Contrôler l'absence de debuggers ou console.trace"
        run: |
          ! grep -rnE "debugger;|console\.trace\(" backend/app extension/src
