name: "Compatibilité Dictionnaires Linguistiques (Bloquant)"

on:
  push:
    paths:
      - "linguistics/**"
      - ".github/workflows/db-compatibility.yml"
  pull_request:
    paths:
      - "linguistics/**"
      - ".github/workflows/db-compatibility.yml"

jobs:
  verify-linguistics:
    name: "Validation Schéma JSON Draft 2020-12 & Cohérence Sémantique"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configurer Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "Installer dépendances de validation"
        run: |
          pip install jsonschema

      - name: "Valider les packs Ewondo, Duala et Fulfulde"
        run: |
          python linguistics/validate_packs.py
