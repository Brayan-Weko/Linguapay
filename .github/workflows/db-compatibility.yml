name: "Compatibilité Multi-Base de Données (Bloquant)"

on:
  push:
    paths:
      - "backend/prisma/**"
      - "backend/scripts/prisma-provider.mjs"
      - ".github/workflows/db-compatibility.yml"
  pull_request:
    paths:
      - "backend/prisma/**"
      - "backend/scripts/prisma-provider.mjs"
      - ".github/workflows/db-compatibility.yml"

jobs:
  verify-providers:
    name: "Génération Schéma Multi-Fournisseurs (SQLite, Postgres, MySQL, Cockroach, Mongo)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configurer Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: "Installer dépendances"
        working-directory: backend
        run: npm ci

      - name: "Tester la génération SQLite"
        working-directory: backend
        env:
          DATABASE_URL: "file:./ci.db"
        run: |
          node scripts/prisma-provider.mjs sqlite
          npx prisma validate

      - name: "Tester la génération PostgreSQL"
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/jobbot?schema=public"
        run: |
          node scripts/prisma-provider.mjs postgresql
          npx prisma validate

      - name: "Tester la génération MySQL"
        working-directory: backend
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/jobbot"
        run: |
          node scripts/prisma-provider.mjs mysql
          npx prisma validate

      - name: "Tester la génération MongoDB"
        working-directory: backend
        env:
          DATABASE_URL: "mongodb://localhost:27017/jobbot"
        run: |
          node scripts/prisma-provider.mjs mongodb
          npx prisma validate

