name: End-to-End Live API Smoke Test

on:
  push:
    branches: [main, master, develop, dev, staging]
  pull_request:
    branches: [main, master, develop, dev, staging]

jobs:
  smoke-test:
    name: Backend Live HTTP Probes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Initialize SQLite, Seed, and Build
        run: |
          npm run db:generate
          npm run db:push
          npm run db:seed
          npm run build
        working-directory: backend
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-e2e-secret-key-32-chars-minimum-length"
          ADMIN_JWT_SECRET: "ci-e2e-admin-secret-key-32-chars-min"
          ENCRYPTION_KEY: "ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMhIQ=="

      - name: Start backend server and probe HTTP endpoints
        run: |
          node dist/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          echo "Waiting for backend to be ready on http://localhost:3000/health..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "Backend is live and healthy!"
              break
            fi
            sleep 1
          done

          echo "Testing /health..."
          curl -f http://localhost:3000/health || exit 1

          echo "Testing /v1/public/config..."
          curl -f http://localhost:3000/v1/public/config || exit 1

          echo "Testing /v1/public/plans..."
          curl -f http://localhost:3000/v1/public/plans || exit 1

          echo "Testing /v1/public/geo/cities..."
          curl -f "http://localhost:3000/v1/public/geo/cities?countries=CM" || exit 1

          echo "Testing /docs JSON..."
          curl -f http://localhost:3000/docs/json || exit 1

          echo "All live HTTP probes passed successfully!"
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: 3000
          HOST: 0.0.0.0
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-e2e-secret-key-32-chars-minimum-length"
          ADMIN_JWT_SECRET: "ci-e2e-admin-secret-key-32-chars-min"
          ENCRYPTION_KEY: "ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMhIQ=="
          SWAGGER_ENABLED: "true"
          CORS_ORIGINS: "http://localhost:8443,http://localhost:5173"
          COOKIE_SECURE: "false"

