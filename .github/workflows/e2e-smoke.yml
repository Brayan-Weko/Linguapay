name: End-to-End Live Extension & API Smoke Test

on:
  push:
    branches: [main, master, develop, dev, staging]
  pull_request:
    branches: [main, master, develop, dev, staging]

jobs:
  e2e-smoke:
    name: Playwright E2E Integration Probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install extension dependencies & build
        run: |
          npm install
          npm run build
        working-directory: extension

      - name: Install backend dependencies & Playwright
        run: |
          pip install -r backend/requirements.txt
          pip install playwright pytest
          python -m playwright install --with-deps chromium

      - name: Run E2E Smoke Test
        run: |
          xvfb-run --auto-servernum -- python tests-e2e/run_smoke.py
