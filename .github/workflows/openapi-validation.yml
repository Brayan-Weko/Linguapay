name: OpenAPI Specification & Swagger Validation

on:
  push:
    branches: [main, master, develop, dev, staging]
    paths:
      - 'backend/app/**'
      - 'backend/openapi.json'
      - '.github/workflows/openapi-validation.yml'
  pull_request:
    branches: [main, master, develop, dev, staging]
    paths:
      - 'backend/app/**'
      - 'backend/openapi.json'
      - '.github/workflows/openapi-validation.yml'

jobs:
  validate-openapi:
    name: Verify Swagger / OpenAPI Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Export OpenAPI Specification to JSON
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, 'backend')
          from app.main import app
          schema = app.openapi()
          with open('backend/openapi.json', 'w', encoding='utf-8') as f:
              json.dump(schema, f, indent=2, ensure_ascii=False)
          print('Successfully exported OpenAPI specification with', len(schema['paths']), 'endpoints.')
          "

      - name: Validate OpenAPI specification structure & endpoints
        run: |
          python -c "
          import json, sys
          with open('backend/openapi.json', 'r', encoding='utf-8') as f:
              spec = json.load(f)

          assert spec.get('openapi', '').startswith('3.'), 'Invalid OpenAPI version'
          assert 'LinguaPay' in spec.get('info', {}).get('title', ''), 'Missing LinguaPay title'
          assert spec.get('info', {}).get('version') == '1.0.0', 'Invalid API version'

          paths = spec.get('paths', {})
          expected = [
              '/api/v1/health',
              '/api/v1/translate',
              '/api/v1/translate/batch',
              '/api/v1/glossary/{lang}',
              '/api/v1/audit/recent',
              '/api/v1/tts/sequence',
              '/api/v1/tts/capsule/{lang}/{clip_name}'
          ]
          for p in expected:
              assert p in paths, f'Missing required endpoint {p}'
              for m, op in paths[p].items():
                  assert op.get('summary'), f'Missing summary on {m.upper()} {p}'
                  assert op.get('description'), f'Missing description on {m.upper()} {p}'
                  assert '200' in op.get('responses', {}), f'Missing 200 response on {m.upper()} {p}'

          print(f'OpenAPI specification fully validated: {len(paths)} endpoints compliant with SAFINUM standards.')
          "
